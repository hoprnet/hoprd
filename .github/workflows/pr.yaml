---
################################################################################
# Pull request pipeline for hoprd
################################################################################
name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
  id-token: write # zizmor: ignore[excessive-permissions]
concurrency:
  group: ${{ github.event.pull_request.head.ref || github.ref_name }}-pr
  cancel-in-progress: true
jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@77a4082b841706ac431479b7e2bb11216ffef250 # main on 20.02.2025
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  validate-release-branch-deps:
    name: Release branch dependencies
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every hoprnet git dependency must track a release branch
        run: |
          set -euo pipefail

          # Cargo forbids `branch` and `rev` together, so the branch lives in the
          # manifest and the resolved commit in the lock. A bare `rev` pin therefore
          # loses the branch entirely, and nothing else notices: the build still
          # succeeds against whatever commit was pinned, however stale, and the drift
          # only surfaces as behaviour that does not match the release it claims.
          fail=0

          # Manifests: any line naming the hoprnet repo must carry branch = "release/...".
          # Matched on `hoprnet/hoprnet` rather than a full URL literal, so a `.git` suffix or a
          # different scheme still counts. The lock check below is the authoritative one -- it
          # sees the resolved source however the manifest was spelled, including a multi-line
          # [dependencies.hopr-lib] table this line-based scan would miss entirely.
          while IFS= read -r line; do
            case "${line}" in
              *'branch = "release/'*) ;;
              *) echo "::error::not on a release branch: ${line}"; fail=1 ;;
            esac
          done < <(grep -nE 'git *= *"[^"]*hoprnet/hoprnet' Cargo.toml || true)

          # Lock: the resolved source must record the same, so a stale lock cannot
          # quietly outlive a corrected manifest.
          while IFS= read -r src; do
            case "${src}" in
              *'?branch=release%2F'*) ;;
              *) echo "::error::lock entry is not from a release branch: ${src}"; fail=1 ;;
            esac
          done < <(grep -o 'source = "git+https://github.com/hoprnet/hoprnet[^"]*"' Cargo.lock | sort -u || true)

          if [ "${fail}" -ne 0 ]; then
            echo "::error::hoprnet dependencies must use branch = \"release/<x.y>\"; a bare rev pin is not accepted"
            exit 1
          fi

          echo "All hoprnet git dependencies track a release branch:"
          grep -n 'git = "https://github.com/hoprnet/hoprnet"' Cargo.toml || true
          grep -o 'source = "git+https://github.com/hoprnet/hoprnet[^"]*"' Cargo.lock | sort -u || true
  checks:
    name: Check
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@3ee95c480962bb3c1fc0061887da9ba735f537c7 # workflow-checks-v2
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      lint_command: "nix build -L .#quick"
      runner_small: depot-ubuntu-24.04
      runner_large: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  tests:
    name: Test
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@3ee95c480962bb3c1fc0061887da9ba735f537c7 # workflow-tests-v6
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      enable_unit_tests: true
      enable_integration_tests: false
      enable_nightly_tests: true
      enable_benchmarks: false
      enable_unit_coverage: true
      enable_integration_coverage: false
      unit_coverage_command: "nix build -L .#coverage -o coverage.lcov"
      runner_unit: depot-ubuntu-24.04-16
      runner_integration: depot-ubuntu-24.04-8
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  build-binaries:
    name: Binary ${{ matrix.binary }} ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#binary-hoprd-x86_64-linux
            build_file: ./hoprd/Cargo.toml
            binary: hoprd
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-8
            build_command: nix build -L .#binary-hoprd-aarch64-linux
            build_file: ./hoprd/Cargo.toml
            binary: hoprd
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: depot-macos-15
            build_command: nix build -L .#binary-hoprd-aarch64-darwin
            build_file: ./hoprd/Cargo.toml
            binary: hoprd
            required_label: binary:aarch64-darwin
          - architecture: x86_64-darwin
            runner: depot-macos-15
            build_command: nix build -L .#binary-hoprd-x86_64-darwin
            build_file: ./hoprd/Cargo.toml
            binary: hoprd
            required_label: binary:x86_64-darwin
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#binary-hoprd-localcluster-x86_64-linux
            build_file: ./localcluster/Cargo.toml
            binary: hoprd-localcluster
            required_label: ""
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@fd29bf3c58b72faacc300e068a05b59eb3b180bc # 0.10.1
    permissions:
      contents: read
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      build_file: ${{ matrix.build_file }}
      build_command: ${{ matrix.build_command }}
      binary: ${{ matrix.binary }}
      runner: ${{ matrix.runner }}
      enabled: ${{ matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GPG_HOPRNET_PRIVATE_KEY }}
  build-docker:
    name: Docker
    needs: build-binaries
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@daaa7da25fb983e55c4a44e63fe02522a7ac6408 # build-docker-v3.2.2
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
      version_type: commit
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-hoprd-x86_64-linux",
            "build_debug_command": "nix build -L .#docker-hoprd-dev-x86_64-linux"
          }
        ]
      build_file: ./hoprd/Cargo.toml
      docker_image_name: hoprd
      docker_image_format: skopeo
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  docs:
    name: Docs
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Build docs
        uses: hoprnet/hopr-workflows/actions/nix-action@3ee95c480962bb3c1fc0061887da9ba735f537c7 # nix-action-v1
        with:
          source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: nix build -L .#docs
  localcluster-smoke:
    name: Localcluster smoke
    # Runs after the binaries are built so both `nix build`s below are Cachix cache
    # hits rather than rebuilds — this job is dominated by waiting, not by compute.
    needs: build-binaries
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Pinned by digest so a chain-image rebuild cannot silently break CI.
      # Keep in sync with localcluster/docker-compose.yml.
      CHAIN_IMAGE: >-
        europe-west3-docker.pkg.dev/hoprassociation/docker-images/bloklid-anvil@sha256:7b64692cb74a2bc065e8de3ac11d24520889528fe9083e2233774b9cede3dbbc
    steps:
      - name: Start a local cluster and verify it becomes usable
        uses: hoprnet/hopr-workflows/actions/nix-action@3ee95c480962bb3c1fc0061887da9ba735f537c7 # nix-action-v1
        with:
          source_branch: ${{ github.event.pull_request.head.ref || github.ref }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: |
            nix build -L .#binary-hoprd-x86_64-linux -o result-hoprd
            nix build -L .#binary-hoprd-localcluster-x86_64-linux -o result-localcluster
            HOPRD_BIN="$PWD/result-hoprd/bin/hoprd" \
            LOCALCLUSTER_BIN="$PWD/result-localcluster/bin/hoprd-localcluster" \
            DATA_DIR="$RUNNER_TEMP/localcluster" \
              ./scripts/localcluster-smoke.sh
