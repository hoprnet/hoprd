---
################################################################################
# Pull request pipeline for hoprd
################################################################################
name: PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true
jobs:
  validate-pr-title:
    name: Validate title
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            build
            chore
            docs
            style
            refactor
            perf
            test
            ci
            revert
          requireScope: false
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
  label:
    name: Add labels
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # Fork PRs get a read-only token and cannot write labels; stay green so the gate passes.
    continue-on-error: true
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/labeler@77a4082b841706ac431479b7e2bb11216ffef250 # main on 20.02.2025
        with:
          sync-labels: true
      - name: Add "external" label for forked PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "external"
          fi
  validate-release-branch-deps:
    name: Release branch dependencies
    # Only PRs onto a `release/*` branch, which is where tracking a hoprnet release branch is the
    # rule. Development elsewhere has to be able to pin a rev: hoprnet publishes neither `hopr-lib`
    # nor `hopr-utils-session`, so work that depends on an unreleased change has a git rev and
    # nothing else until a release branch carries it.
    #
    # This is a job-level `if`, not a workflow-level branch filter, and the difference matters
    # because the check is required on the default branch: a conditionally skipped job still
    # reports, whereas a workflow filtered out never does and would leave every PR waiting on a
    # status that cannot arrive.
    #
    # Note the `release` ruleset does not list this check among its required ones, so with this
    # condition it informs rather than gates. Making it gate again means adding it there.
    if: >-
      github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every hoprnet git dependency must track a release branch
        run: |
          set -euo pipefail

          # Cargo forbids `branch` and `rev` together, so the branch lives in the
          # manifest and the resolved commit in the lock. A bare `rev` pin therefore
          # loses the branch entirely, and nothing else notices: the build still
          # succeeds against whatever commit was pinned, however stale, and the drift
          # only surfaces as behaviour that does not match the release it claims.
          fail=0

          # Manifests: any line naming the hoprnet repo must carry branch = "release/...".
          # Matched on `hoprnet/hoprnet` rather than a full URL literal, so a `.git` suffix or a
          # different scheme still counts. The lock check below is the authoritative one -- it
          # sees the resolved source however the manifest was spelled, including a multi-line
          # [dependencies.hopr-lib] table this line-based scan would miss entirely.
          while IFS= read -r line; do
            case "${line}" in
              *'branch = "release/'*) ;;
              *) echo "::error::not on a release branch: ${line}"; fail=1 ;;
            esac
          done < <(grep -nE 'git *= *"[^"]*hoprnet/hoprnet' Cargo.toml || true)

          # Lock: the resolved source must record the same, so a stale lock cannot
          # quietly outlive a corrected manifest.
          while IFS= read -r src; do
            case "${src}" in
              *'?branch=release%2F'*) ;;
              *) echo "::error::lock entry is not from a release branch: ${src}"; fail=1 ;;
            esac
          done < <(grep -o 'source = "git+https://github.com/hoprnet/hoprnet[^"]*"' Cargo.lock | sort -u || true)

          if [ "${fail}" -ne 0 ]; then
            echo "::error::hoprnet dependencies must use branch = \"release/<x.y>\"; a bare rev pin is not accepted"
            exit 1
          fi

          echo "All hoprnet git dependencies track a release branch:"
          grep -n 'git = "https://github.com/hoprnet/hoprnet"' Cargo.toml || true
          grep -o 'source = "git+https://github.com/hoprnet/hoprnet[^"]*"' Cargo.lock | sort -u || true
  # Gate jobs through inputs on the reusable workflows, not with a caller-level
  # `if:`: an input-skipped inner job still reports its required check name as
  # skipped (green), a skipped caller job does not.
  changes:
    name: Detect changes
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "hoprd/**"
              - "rest-api/**"
              - "rest-api-client/**"
              - "localcluster/**"
              - "profiling/**"
              - "scripts/**"
              - "deploy/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "rust-toolchain-nightly.toml"
              - ".cargo/**"
              - "flake.nix"
              - "flake.lock"
              - ".github/workflows/**"
            lockfile:
              - "Cargo.toml"
              - "Cargo.lock"
              - ".cargo/**"
  checks:
    name: Check
    # In the merge queue we don't re-run the heavy checks, but their contexts
    # (`Check / *`) are required and must report on the merge group or the queue
    # stalls. So the job runs on merge_group too, with the reusable workflow's
    # enable booleans turned off there: the work is skipped while each `Check / *`
    # still reports (green). Only Integration throughput does real work in the
    # queue (see merge-queue.yaml). `!= 'merge_group'` keeps PR behaviour intact.
    needs: changes
    uses: hoprnet/hopr-workflows/.github/workflows/checks.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-checks-v3.0.0
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      format: ${{ github.event_name != 'merge_group' }}
      pre_commit: ${{ github.event_name != 'merge_group' }}
      lint: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      deps: ${{ github.event_name != 'merge_group' }}
      audit: ${{ github.event_name != 'merge_group' && needs.changes.outputs.lockfile == 'true' }}
      lint_command: "nix build -L .#quick"
      runner_small: depot-ubuntu-24.04
      runner_large: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  tests:
    name: Test
    # Runs on merge_group too, but the enable booleans are off there so the
    # `Test / *` contexts report (skipped) without re-running (see `checks`).
    # Stage 2: after the checks. `!failure()` lets a skipped `checks` (merge queue) through so the
    # `Test / *` contexts still report; a failed `checks` still skips this job.
    if: ${{ !cancelled() && !failure() }}
    needs: [changes, checks]
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload in the coverage job
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-tests-v7.0.0
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      enable_unit_tests: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      enable_integration_tests: false
      enable_nightly_tests: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      enable_benchmarks: false
      enable_unit_coverage: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' }}
      enable_integration_coverage: false
      unit_coverage_command: "nix build -L .#coverage -o coverage.lcov"
      runner_unit: depot-ubuntu-24.04-16
      runner_integration: depot-ubuntu-24.04-8
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  build-binaries:
    name: Binary ${{ matrix.binary }} ${{ matrix.architecture }}
    # Runs on merge_group too; `enabled` is off there so the `Binary … / Build`
    # and `… / Sign and Publish` contexts report (skipped) without rebuilding
    # (see `checks`). The reusable job carries the matrix so names stay expanded.
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#binary-hoprd-x86_64-linux
            build_file: ./hoprd/Cargo.toml
            binary: hoprd
            required_label: ""
          - architecture: aarch64-linux
            runner: depot-ubuntu-24.04-arm-8
            build_command: nix build -L .#binary-hoprd-aarch64-linux
            build_file: ./hoprd/Cargo.toml
            binary: hoprd
            required_label: "binary:aarch64-linux"
          - architecture: aarch64-darwin
            runner: depot-macos-15
            build_command: nix build -L .#binary-hoprd-aarch64-darwin
            build_file: ./hoprd/Cargo.toml
            binary: hoprd
            required_label: binary:aarch64-darwin
          - architecture: x86_64-darwin
            runner: depot-macos-15
            build_command: nix build -L .#binary-hoprd-x86_64-darwin
            build_file: ./hoprd/Cargo.toml
            binary: hoprd
            required_label: binary:x86_64-darwin
          - architecture: x86_64-linux
            runner: depot-ubuntu-24.04-8
            build_command: nix build -L .#binary-hoprd-localcluster-x86_64-linux
            build_file: ./localcluster/Cargo.toml
            binary: hoprd-localcluster
            required_label: ""
    # Stage 3: after checks and tests (see `tests` for `!failure()`).
    if: ${{ !cancelled() && !failure() }}
    needs: [changes, checks, tests]
    uses: hoprnet/hopr-workflows/.github/workflows/build-binaries.yaml@3df1022f4b852f1b7acd064123ce819258a62fe3 # build-binaries-v4.0.1
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      architecture: ${{ matrix.architecture }}
      build_file: ${{ matrix.build_file }}
      build_command: ${{ matrix.build_command }}
      binary: ${{ matrix.binary }}
      runner: ${{ matrix.runner }}
      enabled: ${{ github.event_name != 'merge_group' && needs.changes.outputs.rust == 'true' && (matrix.required_label == '' || contains(github.event.pull_request.labels.*.name, matrix.required_label)) }}
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      gpg_private_key: ${{ secrets.GPG_HOPRNET_PRIVATE_KEY }}
  build-docker:
    name: Docker
    # Docker builds are too heavy to run in the queue and build-docker.yaml has no
    # skip input, so this stays skipped on merge_group; the required `Docker / *`
    # contexts are reported (green) by merge-queue-docker.yaml instead.
    # Stage 3. Not path-filtered, for the same reason it stays out of the merge queue (see
    # above): a skipped caller would leave the required `Docker / *` contexts unreported.
    # `!failure()` also lets it run after a skipped `build-binaries` (path filter false).
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' }}
    needs: [changes, checks, tests, build-binaries]
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@3df1022f4b852f1b7acd064123ce819258a62fe3 # build-docker-v4.0.1
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-hoprd-x86_64-linux",
            "build_debug_command": "nix build -L .#docker-hoprd-dev-x86_64-linux"
          }
        ]
      build_file: ./hoprd/Cargo.toml
      docker_image_name: hoprd
      docker_image_format: skopeo
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  build-docker-pix-test:
    name: Docker (pix-test)
    # Not a required check; skip in the merge queue.
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' }}
    needs: [changes, checks, tests, build-binaries]
    uses: hoprnet/hopr-workflows/.github/workflows/build-docker.yaml@3df1022f4b852f1b7acd064123ce819258a62fe3 # build-docker-v4.0.1
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      version_type: commit
      concurrency_group_suffix: pix-test
      build_matrix: >-
        [
          {
            "runner": "depot-ubuntu-24.04-4",
            "architecture": "x86_64-linux",
            "build_command": "nix build -L .#docker-hoprd-pix-test-x86_64-linux"
          },
          {
            "runner": "depot-ubuntu-24.04-arm-4",
            "architecture": "aarch64-linux",
            "build_command": "nix build -L .#docker-hoprd-pix-test-aarch64-linux"
          }
        ]
      build_file: ./hoprd/Cargo.toml
      docker_image_name: hoprd-pix-test
      docker_image_format: skopeo
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  docs:
    name: Docs
    # Not a required check; skip in the merge queue and for changes outside the code paths.
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true' }}
    needs: [changes, checks, tests]
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Build docs
        uses: hoprnet/hopr-workflows/actions/nix-action@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # nix-action-v2.0.0
        with:
          repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: nix build -L .#docs
  localcluster-smoke:
    name: Localcluster smoke
    # Not a required check; skip in the merge queue and for changes outside the code paths.
    if: ${{ !cancelled() && !failure() && github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true' }}
    # Runs after the binaries are built so both `nix build`s below are Cachix cache
    # hits rather than rebuilds — this job is dominated by waiting, not by compute.
    needs: [changes, checks, tests, build-binaries]
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Pinned by digest so a chain-image rebuild cannot silently break CI.
      # Keep in sync with localcluster/docker-compose.yml.
      CHAIN_IMAGE: >-
        europe-west3-docker.pkg.dev/hoprassociation/docker-images/bloklid-anvil@sha256:4759ab083b106283e96f3740e23634de2fdf9abf209cd0539932a39b5f64dcc1
    steps:
      - name: Start a local cluster and verify it becomes usable
        uses: hoprnet/hopr-workflows/actions/nix-action@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # nix-action-v2.0.0
        with:
          repo_sha: ${{ github.event.pull_request.head.sha || github.sha }}
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          command: |
            nix build -L .#binary-hoprd-x86_64-linux -o result-hoprd
            nix build -L .#binary-hoprd-localcluster-x86_64-linux -o result-localcluster
            HOPRD_BIN="$PWD/result-hoprd/bin/hoprd" \
            LOCALCLUSTER_BIN="$PWD/result-localcluster/bin/hoprd-localcluster" \
            DATA_DIR="$RUNNER_TEMP/localcluster" \
              ./scripts/localcluster-smoke.sh
  # Single aggregate merge gate: green only if every other job in this run
  # succeeded. Mark THIS one as the required check in the branch ruleset, so
  # adding, renaming, or removing a job never needs a ruleset change.
  # `if: always()` runs it even when a dependency fails; alls-green then reds
  # the gate on any non-success (a failed job, or a skip that is not allowed).
  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - validate-pr-title
      - label
      - validate-release-branch-deps
      - changes
      - checks
      - tests
      - build-binaries
      - build-docker
      - build-docker-pix-test
      - docs
      - localcluster-smoke
    runs-on: depot-ubuntu-24.04
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          # Always allowed: the PR-only jobs and the release-branch check (runs only on release/* bases).
          # Merge queue: checks, tests, binaries, docker, docs and smoke are not re-run there by
          # design (see `checks`); the queue only runs Integration throughput (merge-queue.yaml).
          # Path filter: tests, binaries, docs and smoke skip only when no code path changed.
          # A failed job reds the gate either way; a Rust change that skips tests does too.
          allowed-skips: ${{ format('validate-pr-title, label, validate-release-branch-deps{0}{1}', github.event_name == 'merge_group' && ', checks, tests, build-binaries, build-docker, build-docker-pix-test, docs, localcluster-smoke' || '', needs.changes.outputs.rust != 'true' && ', tests, build-binaries, docs, localcluster-smoke' || '') }}
