# Images, including the initialized database, are supplied by one release manifest.
# No service in this stack is built on the developer's machine.
x-service-env: &service-env
  NODE_ENV: development
  LOG_LEVEL: info
  DATABASE_URL: postgresql://curvy:curvy@db:5432/curvy
  DB_POOL_MAX: "5"
  DB_POOL_MIN: "1"
  CHAINS: '[{"chainId":31337,"rpcUrl":"http://127.0.0.1:8545","startBlock":0,"eventSource":"rpc","finality":"confirmations","confirmationDepth":1,"allowSingleRpc":true,"pollIntervalMs":1000,"finalityPollIntervalMs":1000}]'

services:
  chain:
    image: ${CURVY_CHAIN_IMAGE:?release manifest required}
    platform: ${CURVY_PLATFORM}
    container_name: hopr-chain
    ports:
      - "127.0.0.1:8080:8080"

  db:
    # Public hopr-localcluster-pg: schemas/users are already in PGDATA. A fresh
    # named volume receives the image's data; no migrations run on this machine.
    image: ${CURVY_LOCALDB_IMAGE:?release manifest required}
    platform: ${CURVY_PLATFORM}
    environment:
      POSTGRES_USER: curvy
      POSTGRES_PASSWORD: curvy
      POSTGRES_DB: curvy
      PGDATA: ${CURVY_PGDATA:-/var/lib/postgresql/data}
    volumes:
      - database:${CURVY_PGDATA:-/var/lib/postgresql/data}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U curvy -d curvy"]
      interval: 2s
      timeout: 3s
      retries: 90

  # Anvil in the HOPR chain image listens on loopback. These workers share its
  # network namespace; neither Anvil nor the workers' ports are published.
  indexer:
    image: ${CURVY_INDEXER_IMAGE:?release manifest required}
    platform: ${CURVY_PLATFORM}
    network_mode: service:chain
    environment:
      <<: *service-env
      DB_SCHEMA: indexer
      PORT: "4300"
      INDEXER_MODE: both
    depends_on:
      db:
        condition: service_healthy

  relayer:
    image: ${CURVY_RELAYER_IMAGE:?release manifest required}
    platform: ${CURVY_PLATFORM}
    network_mode: service:chain
    environment:
      <<: *service-env
      DB_SCHEMA: relayer
      PORT: "4400"
      RELAYER_MODE: both
      RELAYER_PRIVATE_KEY: ${CURVY_RELAYER_KEY}
      PP_MODE: "off"
      SUBMIT_INCLUSION_CONFIRMATIONS: "1"
      # Local gas is funded before startup. No paymaster fee note is charged.
    depends_on:
      db:
        condition: service_healthy

  batch-prover:
    image: ${CURVY_BATCH_PROVER_IMAGE:?release manifest required}
    # Artifacts are mounted and verified by the launcher. Await the actual
    # application module's database/recovery/worker startup before reporting ready.
    entrypoint: ["node", "--import", "./build/sentry.js", "--eval", "import('./build/index.js').then(() => console.log('curvy-localcluster: batch prover started'));"]
    platform: ${CURVY_PLATFORM}
    network_mode: service:chain
    environment:
      <<: *service-env
      DB_SCHEMA: batch_prover
      INDEXER_DATABASE_URL: postgresql://curvy:curvy@db:5432/curvy
      PROVER_PRIVATE_KEY: ${CURVY_PROVER_KEY}
      PENDING_NOTES_COMMITMENT_GRAPH: /keys/${CURVY_PENDING_GRAPH}
      PENDING_NOTES_COMMITMENT_GRAPH_SHA256: ${CURVY_PENDING_GRAPH_SHA256}
      PENDING_NOTES_COMMITMENT_ZKEY: /keys/${CURVY_PENDING_ZKEY}
      PENDING_NOTES_COMMITMENT_ZKEY_SHA256: ${CURVY_PENDING_ZKEY_SHA256}
      PROVER_THREADS: "1"
      POLL_INTERVAL_MS: "1000"
      # Commit partial batches promptly, including the Entry's first shield.
      # Keep the verifier's batch dimension (5); changing BATCH_SIZE is invalid.
      MAX_BATCH_AGE_MS: "1000"
      ZK_KEYS_BUCKET: ""
    volumes:
      - ${CURVY_RUN_DIR}/keys:/keys:ro
    depends_on:
      db:
        condition: service_healthy

  metadata:
    image: ${CURVY_METADATA_IMAGE:?release manifest required}
    platform: ${CURVY_PLATFORM}
    environment:
      <<: *service-env
      DB_SCHEMA: metadata
      PORT: "4100"
      BASE_URL: http://127.0.0.1:3000
      JWT_SECRET: localcluster-only-jwt
      TOTP_SECRET: localcluster-only-totp
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: ${CURVY_GATEWAY_IMAGE:?release manifest required}
    platform: ${CURVY_PLATFORM}
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      metadata:
        condition: service_started
      relayer:
        condition: service_started
      indexer:
        condition: service_started

volumes:
  database:
