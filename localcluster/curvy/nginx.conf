events {}
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server {
    listen 80;
    proxy_read_timeout 120s;
    location /relay { proxy_pass http://chain:4400; }
    location = /relay-health { proxy_pass http://chain:4400/health; }
    location = /sync/ready { proxy_pass http://chain:4300/ready; }
    location /sync/ { proxy_pass http://chain:4300; }
    location /notes/ { proxy_pass http://chain:4300; }
    # Local fee collector public keys, checked against the chain before startup.
    location = /protocol {
      default_type application/json;
      alias /usr/share/nginx/html/protocol.json;
    }
    location / { return 404; }
  }
}
