---
# FIXME: The nodes can't dial each other within the docker container. 
services:
  chain:
    container_name: hoprd-blokli-anvil
    platform: linux/amd64
    # Pinned by digest; keep in sync with CHAIN_IMAGE in .github/workflows/pr.yaml.
    # 0.13.4-pr.543; earlier pins were garbage-collected from the registry (404).
    image: europe-west3-docker.pkg.dev/hoprassociation/docker-images/bloklid-anvil@sha256:dcaa7bfd108a85435de6554e081675dbac81937d9f4d101c8a2b89fb6a0ce4bb
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  cluster:
    container_name: hoprd-localcluster
    platform: linux/amd64
    image: hoprd-localcluster:latest
    depends_on:
      chain:
        condition: service_healthy
    environment:
      HOPRD_CHAIN_URL: http://chain:8080
      RUST_LOG: debug
    command:
      - --size
      - "${CLUSTER_SIZE:-3}"
      - --api-port-base
      - "3001"
      - --p2p-port-base
      - "9001"
    ports:
      - "3001-300${CLUSTER_SIZE:-3}:3001-300${CLUSTER_SIZE:-3}"
