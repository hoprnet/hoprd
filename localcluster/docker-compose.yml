---
# FIXME: The nodes can't dial each other within the docker container. 
services:
  chain:
    container_name: hoprd-blokli-anvil
    platform: linux/amd64
    # Pinned by digest; keep in sync with CHAIN_IMAGE in .github/workflows/pr.yaml.
    # The previous 0.10.5-pr.349 pin was garbage-collected from the registry (404).
    # Moved off 7b64692c because `hopr-types` 4.0.0 added a required `service_registry`
    # contract address that image predates: the cluster aborts on startup with
    # "contract addresses not a valid JSON: missing field `service_registry`".
    image: europe-west3-docker.pkg.dev/hoprassociation/docker-images/bloklid-anvil@sha256:f9286db9e9cfdba52e7632ef4a6c521b70b13d8552b912b7f31bad2eab1bfa5e
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  cluster:
    container_name: hoprd-localcluster
    platform: linux/amd64
    image: hoprd-localcluster:latest
    depends_on:
      chain:
        condition: service_healthy
    environment:
      HOPRD_CHAIN_URL: http://chain:8080
      RUST_LOG: debug
    command:
      - --size
      - "${CLUSTER_SIZE:-3}"
      - --api-port-base
      - "3001"
      - --p2p-port-base
      - "9001"
    ports:
      - "3001-300${CLUSTER_SIZE:-3}:3001-300${CLUSTER_SIZE:-3}"
