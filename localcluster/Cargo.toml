[package]
name = "hoprd-localcluster"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

description = "Local HOPR cluster runner using external hoprd processes"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
# The PIX pool pairing here is what the *harness* compiles its PIX config types against — see
# `strategy-pix-test` in hoprd's Cargo.toml. The nodes are a separate build: `cargo build
# --release -p hoprd` produces the binary the harness launches from `HOPRD_BIN`, carrying
# whichever pool it was built with, and nothing links the two. That is workable because the
# harness never settles anything: the plain pool's config stanza is a subset of the Curvy pool's,
# and `session_pix_soak` reads the binary to learn which pool it carries and adapts its
# accounting to it. The plain pool here because it needs nothing at runtime.
hoprd = { workspace = true, features = [
  "runtime-tokio",
  "telemetry",
  "transport-quic",
  "strategy-pix-test",
] }
hopr-chain-connector = { workspace = true }
hopr-strategy = { workspace = true, features = [
  "runtime-tokio",
  "strategy-auto-redeeming",
  "strategy-channel-lifecycle",
  # The same name hoprd's feature above has, and upstream's own; see that feature's comment in
  # `hoprd/Cargo.toml`.
  "strategy-pix-test",
] }
hopr-lib = { workspace = true }
hopr-session-server-forwarder = { workspace = true }
hoprd-api-client = { workspace = true }
hoprd-api = { workspace = true }
nix = { workspace = true, features = ["fs", "signal"] }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
validator = { workspace = true }
