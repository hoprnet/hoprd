[package]
name = "hoprd-localcluster"
version = "0.3.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

description = "Local HOPR cluster runner using external hoprd processes"

[features]
default = ["strategy-pix-secp256k1"]
strategy-pix-secp256k1 = [
  "hoprd/strategy-pix-secp256k1",
  "hopr-strategy/strategy-pix-secp256k1",
]
strategy-pix-curvy = [
  "hoprd/strategy-pix-curvy",
  "hopr-strategy/strategy-pix-curvy",
  "hopr-chain-connector/pix-curvy-sdk",
]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
# The PIX pool pairing has to match the one the *binary* under test was built with — see
# `strategy-pix-secp256k1` in hoprd's Cargo.toml. It is stated in both places because these are
# two different builds: this one produces the test harness, and `cargo build --release -p hoprd`
# produces the nodes the harness launches from `HOPRD_BIN`. Nothing links them, so a mismatch is
# only caught by the demo script's binary check and by the pool named in the node's startup log.
#
# secp256k1 because it is the only implemented pool: `strategy-pix-curvy` selects `CurvyDepositPool`,
# whose methods panic. Switch both together when that lands.
hoprd = { workspace = true, features = [
  "runtime-tokio",
  "telemetry",
  "transport-quic",
] }
hopr-chain-connector = { workspace = true }
hopr-strategy = { workspace = true, features = [
  "runtime-tokio",
  "strategy-auto-redeeming",
  "strategy-channel-lifecycle",
] }
hopr-lib = { workspace = true }
hopr-session-server-forwarder = { workspace = true }
hoprd-api-client = { workspace = true }
hoprd-api = { workspace = true }
nix = { workspace = true, features = ["fs", "signal"] }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }
validator = { workspace = true }

[[test]]
name = "session_pix"
required-features = ["strategy-pix-secp256k1"]

[[test]]
name = "session_pix_soak"
required-features = ["strategy-pix-secp256k1"]

[[test]]
name = "session_pix_curvy"
required-features = ["strategy-pix-curvy"]
