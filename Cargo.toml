[workspace]
resolver = "2"
members = ["hoprd", "rest-api", "rest-api-client", "localcluster"]

[workspace.package]
rust-version = "1.91"
authors = ["HOPR Association <tech@hoprnet.org>"]
edition = "2024"
license = "GPL-3.0-only"
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/hoprd"

[workspace.dependencies]
hoprd = { path = "hoprd", default-features = false }
hoprd-api = { path = "rest-api", default-features = false }
hoprd-api-client = { path = "rest-api-client" }

hopr-lib = { git = "https://github.com/hoprnet/hoprnet", rev = "4bb7cea5ecd7a970d64dd1a900357e62a74f0dd4", default-features = false }
# `hopr-strategy` migrated out of the hoprnet workspace to a standalone crate.
hopr-strategy = { version = "0.22.0", default-features = false }
hopr-utils-session = { git = "https://github.com/hoprnet/hoprnet", rev = "4bb7cea5ecd7a970d64dd1a900357e62a74f0dd4", default-features = false }

# crates.io HOPR deps
hopr-api = { version = "1.19" }
hopr-chain-connector = { version = "0.22.1" }
hopr-ct-full-network = { version = "0.3.0", default-features = false }
hopr-network-graph = { version = "0.3.1", default-features = false }
hopr-session-server-forwarder = { version = "0.1.0", default-features = false }
hopr-ticket-manager = { version = "0.5.1", default-features = false, features = [
  "redb",
  "cli",
  "serde",
] }
hopr-transport-p2p = { version = "0.9.4", default-features = false }

# Third-party deps
anyhow = "1.0.104"
home = "0.5.12"
async-signal = "0.2.14"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["http2"] }
base64 = "0.23.0"
bimap = "0.6.3"
bytesize = { version = "2.7.0", features = ["serde"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "clock",
] }
clap = { version = "4.6.5", features = ["derive", "env", "string"] }
const_format = "0.2.36"
console-subscriber = "0.5.0"
flagset = "0.4.7"
futures = { version = "0.3.33", default-features = false, features = [
  "std",
  "async-await",
] }
futures-core = "0.3.33"
http = "1.5.0"
human-bandwidth = { version = "0.1.4", features = ["serde"] }
humansize = "2.1.3"
humantime-serde = "1.1.1"
if-addrs = "0.15.0"
lazy_static = "1.5.0"
mockall = "0.15.0"
mimalloc = { version = "0.1.52", default-features = false, features = [
  "secure",
] }
nix = { version = "0.31.3", features = ["fs", "signal"] }
rstest = "0.26.1"
oas3 = "0.22.0"
openapiv3 = "2.2.0"
opentelemetry = { version = "0.32.0" }
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry-prometheus-text-exporter = { version = "0.3.0" }
opentelemetry_sdk = { version = "0.32.1" }
percent-encoding = "2.3.2"
prettyplease = "0.3.0"
proc-macro-regex = "~1.1.0"
progenitor = "0.14.0"
progenitor-client = "0.14.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
serde_with = { version = "3.21.0", features = ["base64"] }
signal-hook = "0.4.4"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.3", features = ["full"] }
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.19"
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"] }
tikv-jemallocator = "0.7.0"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.0", features = [
  "validate-request",
  "compression-full",
  "cors",
  "trace",
  "sensitive-headers",
] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-opentelemetry = { version = "0.33.0" }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "registry",
  "std",
] }
utoipa = { version = "5.5.0" }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = [
  "axum",
  "vendored",
  "debug-embed",
] }
uuid = { version = "1.23.3" }
validator = { version = "0.21.0", features = ["derive"] }
vergen-gix = { version = "10.0.2", features = ["build"] }

[profile.dev]
panic = "abort"
opt-level = 1
strip = false
debug = true

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.candidate]
inherits = "release"
codegen-units = 16
lto = false
panic = "abort"
strip = true
opt-level = 2

[profile.test]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
opt-level = 3

[profile.bench]
debug = 2
split-debuginfo = "off"
strip = false

# memory profiling profile — inherits release optimizations but preserves debug symbols
# for jeprof symbol resolution
[profile.memprof]
inherits = "release"
debug = 2
strip = false
lto = "thin"
codegen-units = 16

[profile.flamegraph]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16

[workspace.metadata.cargo-shear]
ignored = ["hopr-api"]
