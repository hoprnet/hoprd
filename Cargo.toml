[workspace]
resolver = "2"
members = ["hoprd", "rest-api", "rest-api-client", "localcluster"]

[workspace.package]
rust-version = "1.91"
authors = ["HOPR Association <tech@hoprnet.org>"]
edition = "2024"
license = "GPL-3.0-only"
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/hoprd"

[workspace.dependencies]
hoprd = { path = "hoprd", default-features = false }
hoprd-api = { path = "rest-api", default-features = false }
hoprd-api-client = { path = "rest-api-client" }

# Mirrors hoprnet's declaration for the same reason as the crates.io block below: a divergence
# would put two copies of `hopr-utilities` in the graph. `rest-api` declares it `optional` and no
# feature enables it, and nothing anywhere names `hopr_utils::` — so it is currently inert and both
# ignore lists say so — but it is a real `workspace = true` dependency, unlike `hopr-api`, so it
# would start binding the moment anything switched it on.
hopr-utils = { package = "hopr-utilities", version = "0.9.0" }
# No PIX curve feature here on purpose. The curve is chosen by hoprd's `strategy-pix-*` pairing,
# which bundles it with the matching deposit pool; pinning it at the workspace level would force
# one curve on every build and make the other unreachable — which is exactly the state this
# workspace was in before the split.
hopr-lib = { git = "https://github.com/hoprnet/hoprnet", branch = "lukas/pix", default-features = false }
hopr-strategy = { git = "https://github.com/hoprnet/hopr-strategy", branch = "lukas/pix", default-features = false }
hopr-utils-session = { git = "https://github.com/hoprnet/hoprnet", branch = "lukas/pix", default-features = false }

# crates.io HOPR deps
#
# The six below used to come off the hoprnet branch alongside `hopr-lib`. They were the
# `impls/` workspace members, and hoprnet 10f6d80 extracted them to the `hopr-impls` repo
# and now consumes them from crates.io itself — so pointing them at the branch resolves to
# nothing. Versions and feature flags mirror hoprnet's own declarations exactly; they are
# the same crates it links against, and a divergence here would show up as two copies of a
# type that ought to be one.
#
# `hopr-api` is documentation, not a constraint: no crate in this workspace declares
# `hopr-api = { workspace = true }` and nothing here names `hopr_api::`, so the requirement never
# reaches the resolver and the `=` binds nothing. What hoprd actually links is whatever `hopr-lib`
# asks for. Stating the version it mirrors is the whole value it has, so it is kept in step by hand.
#
# Keeping it in step is not cosmetic. `hopr-api` majors cannot coexist across this boundary: its
# node traits — `HasChainApi`, `ActionableEventSource`, `PacketTransport` and the rest — are
# defined in `hopr-api` itself, so two majors are two unrelated traits and the node hoprd passes to
# `hopr-strategy` satisfies only one of them. `hopr-types` is shared and single-versioned, which is
# why the PIX deposit-address assertion still holds either way and does not catch this. When
# `hopr-strategy` moved to 2.0 ahead of hoprnet, hoprd stopped compiling with 22 such errors until
# hoprnet followed; this line is where that agreement is written down.
hopr-api = { version = "=2.0.0" }
hopr-chain-connector = "0.22.2"
hopr-ct-full-network = { version = "0.4.0", default-features = false }
hopr-network-graph = { version = "0.5.0", default-features = false }
hopr-session-server-forwarder = { version = "0.1.1", default-features = false }
hopr-ticket-manager = "0.5.2"
# `transport-quic` explicitly: published 0.9.4 predates hoprnet's QUIC-by-default change, so
# the feature is what keeps the transport hoprd builds the same as the one hoprnet ships.
hopr-transport-p2p = { version = "0.9.5", features = ["transport-quic"] }

# Third-party deps
anyhow = "1.0.104"
home = "0.5.12"
async-signal = "0.2.14"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["http2"] }
base64 = "0.23.1"
bimap = "0.6.3"
bytesize = { version = "2.7.0", features = ["serde"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "clock",
] }
clap = { version = "4.6.5", features = ["derive", "env", "string"] }
const_format = "0.2.36"
console-subscriber = "0.5.0"
flagset = "0.4.7"
futures = { version = "0.3.33", default-features = false, features = [
  "std",
  "async-await",
] }
futures-core = "0.3.33"
http = "1.5.0"
human-bandwidth = { version = "0.1.4", features = ["serde"] }
humansize = "2.1.3"
humantime-serde = "1.1.1"
if-addrs = "0.15.0"
lazy_static = "1.5.0"
mockall = "0.15.0"
mimalloc = { version = "0.1.52", default-features = false, features = [
  "secure",
] }
nix = { version = "0.31.3", features = ["fs", "signal"] }
rstest = "0.26.1"
oas3 = "0.22.0"
openapiv3 = "2.2.0"
opentelemetry = { version = "0.32.0" }
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry-prometheus-text-exporter = { version = "0.3.0" }
opentelemetry_sdk = { version = "0.32.0" }
percent-encoding = "2.3.2"
prettyplease = "0.3.0"
proc-macro-regex = "~1.1.0"
progenitor = "0.14.0"
progenitor-client = "0.14.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "stream",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.27"
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
serde_with = { version = "3.21.0", features = ["base64"] }
signal-hook = "0.4.4"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.3", features = ["full"] }
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.19"
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"] }
tikv-jemallocator = "0.7.0"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.0", features = [
  "validate-request",
  "compression-full",
  "cors",
  "trace",
  "sensitive-headers",
] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-opentelemetry = { version = "0.33.0" }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "registry",
  "std",
] }
utoipa = { version = "5.5.0" }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = [
  "axum",
  "vendored",
  "debug-embed",
] }
uuid = { version = "1.23.3" }
validator = { version = "0.21.0", features = ["derive"] }
vergen-gix = { version = "9.1.0", features = ["build"] }

[profile.dev]
panic = "abort"
opt-level = 1
strip = false
debug = true

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.candidate]
inherits = "release"
codegen-units = 16
lto = false
panic = "abort"
strip = true
opt-level = 2

[profile.test]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
opt-level = 3

[profile.bench]
debug = 2
split-debuginfo = "off"
strip = false

# memory profiling profile — inherits release optimizations but preserves debug symbols
# for jeprof symbol resolution
[profile.memprof]
inherits = "release"
debug = 2
strip = false
lto = "thin"
codegen-units = 16

[profile.flamegraph]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16

[workspace.metadata.cargo-shear]
ignored = ["oas3", "humantime-serde", "hopr-api", "hopr-utils"]
