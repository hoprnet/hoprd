[workspace]
resolver = "2"
members = ["hoprd", "rest-api", "rest-api-client", "localcluster"]

[workspace.package]
rust-version = "1.97"
authors = ["HOPR Association <tech@hoprnet.org>"]
edition = "2024"
license = "GPL-3.0-only"
homepage = "https://hoprnet.org/"
repository = "https://github.com/hoprnet/hoprd"

[workspace.dependencies]
hoprd = { path = "hoprd", default-features = false }
hoprd-api = { path = "rest-api", default-features = false }
hoprd-api-client = { path = "rest-api-client" }

# No PIX curve feature here on purpose. The curve is chosen by hoprd's `strategy-pix-*` pairing,
# which bundles it with the matching deposit pool; pinning it at the workspace level would force
# one curve on every build and make the other unreachable — which is exactly the state this
# workspace was in before the split.
#
# Both are pinned to a `rev` rather than tracked on a branch, and that matters more here than it
# used to: `1596bc67` is the head of `lukas/session-pix-supervisor`, which is *not* merged. A
# `branch` ref to unmerged work would rewrite this workspace's dependency on every push to it,
# including the rebases and force-pushes a review branch collects. The `rev` is what makes a
# rebuild reproducible, and moving it is a reviewable change.
#
# `1596bc67` is a fast-forward from the `87f0e07d` it replaces — `git merge-base origin/master
# 1596bc67` is `87f0e07d` itself, which is also `master`'s head, so the branch is exactly `master`
# plus its own work and `git log 87f0e07d..1596bc67` is the whole diff. 484 commits, but 31 files:
# it is a long-lived branch that has merged `master` several times, not a wide change.
#
# What it carries: the Exit-side PIX supervisor. `transport/session` gains a `supervision` module —
# a per-Session state machine over the SSA batch with deadlines (commitment, deposit, recovery
# idle, hard recovery), a service gate that meters egress against recovery progress, and
# share-order enforcement that stops a batched Entry spreading its shares across every cycle to
# take `n × quota` while finishing none. `protocols/pix` grows `SsaRecoveryProgress::shares_seen`
# next to `useful_shares` so liveness and payment stop being the same counter, and
# `new_exit_commitment` takes the whole negotiated `PixParams` rather than two of its three fields.
#
# What it costs this workspace is `hoprd/src/config.rs`. Upstream's `IncomingSessionPixConfig` now
# holds its deadlines and batch settings in a nested `SupervisorConfig`, because they are validated
# against each other and against the Exit's reconstructor as a set; `UserIncomingSessionPixConfig`
# keeps them flat and picks up four of the new dials — see there for which, and why the rest stay
# at upstream's numbers.
#
# One of those four is not optional. `max_served_without_progress` bounds how many packets the Exit
# serves without a share coming back, and it has to clear the Session's SURB buffer: a share is
# bound to its SURB when the SURB is minted, so the moment a cycle recovers that whole buffer still
# holds *its* shares — and the supervisor discards progress reported against a recovered cycle.
# Draining the buffer is therefore that many served packets with nothing counting as progress, and a
# gate that blocks partway through stops the SURB spending that was draining it. `session_pix_soak`
# runs a 42 000-SURB buffer against upstream's 2048 and deadlocks one cycle in; it now derives the
# ceiling from the buffer instead. Nothing validates this pairing, and it is invisible at the small
# buffers everything else here uses.
#
# The wire format is untouched, which is what lets the `hoprd-test` PIX scenarios keep pairing an
# Exit built from this tree with an edgli Entry still on `87f0e07d`. `hopr-protocol-start` is not
# among the 31 files: the `SsaRequest`, the commitment burst and `StartSession.additional_data`
# all say what they said before.
#
# These two stay on git because hoprnet does not publish them. Everything it does publish is in
# the crates.io block below, which `hopr-strategy` rejoined once it released 1.0.0.
hopr-lib = { git = "https://github.com/hoprnet/hoprnet", rev = "1596bc67b586d892c00415664ac02eb5606587d5", default-features = false }
hopr-utils-session = { git = "https://github.com/hoprnet/hoprnet", rev = "1596bc67b586d892c00415664ac02eb5606587d5", default-features = false }

# crates.io HOPR deps
#
# The six below used to come off the hoprnet branch alongside `hopr-lib`. They were the
# `impls/` workspace members, and hoprnet 10f6d80 extracted them to the `hopr-impls` repo
# and now consumes them from crates.io itself — so pointing them at the branch resolves to
# nothing. Versions and feature flags mirror hoprnet's own declarations exactly; they are
# the same crates it links against, and a divergence here would show up as two copies of a
# type that ought to be one.
#
# `hopr-api` is documentation, not a constraint: no crate in this workspace declares
# `hopr-api = { workspace = true }` and nothing here names `hopr_api::`, so the requirement never
# reaches the resolver and the `=` binds nothing. What hoprd actually links is whatever `hopr-lib`
# asks for. Stating the version it mirrors is the whole value it has, so it is kept in step by hand.
#
# Keeping it in step is not cosmetic. `hopr-api` majors cannot coexist across this boundary: its
# node traits — `HasChainApi`, `ActionableEventSource`, `PacketTransport` and the rest — are
# defined in `hopr-api` itself, so two majors are two unrelated traits and the node hoprd passes to
# `hopr-strategy` satisfies only one of them. `hopr-types` is shared and single-versioned, which is
# why the PIX deposit-address assertion still holds either way and does not catch this. When
# `hopr-strategy` moved to 2.0 ahead of hoprnet, hoprd stopped compiling with 22 such errors until
# hoprnet followed; this line is where that agreement is written down.
hopr-api = { version = "=4.1.0" }
hopr-chain-connector = "0.26.0"
hopr-ct-full-network = { version = "0.6.0", default-features = false }
hopr-network-graph = { version = "0.7.0", default-features = false }
hopr-session-server-forwarder = { version = "0.3.0", default-features = false }
# A caret range, not `=`. The `=` on `hopr-api` above exists because that one is inert and its
# only job is to document a version; this is a real dependency the resolver acts on, and pinning
# it exactly would conflict with any other crate in the graph asking for a later 4.x.
#
# 4.0.0 is `477ab741` on that repo's `main` — the squash-merge of hopr-strategy#51 — per the
# release's `.cargo_vcs_info.json`. Verified rather than assumed: the published `src/` tree diffs
# clean against that commit, the only omissions being the `insta` snapshot directories, which the
# package excludes and no consumer compiles.
#
# 4.0.0 is the third major in a fortnight, and it had to be taken together with the `hopr-lib` rev
# above: 2.0.0 moved to `hopr-api` 3.0 and 3.0.0 to `hopr-api` 4.1, which is the agreement the
# `hopr-api` line above records. Sitting still was not an option once hoprnet moved — the
# `PixEvent` the node emits and the one the pool consumes are the same type only when both sides
# agree on the major.
#
# What those majors changed for this workspace:
#   - `strategy-pix-secp256k1` became `strategy-pix-test`, and `pix::secp256k1` became
#     `pix::pools::plain` — renamed upstream so that a pool offering no anonymity is named for how
#     it settles rather than for the curve it settles on, and cannot be reached for in production
#     by that curve name. hoprd's own feature, its flake outputs, its Docker image and
#     `pix-demo.sh`'s `PIX_POOL` followed, so there is one name for it end to end.
#   - **The Safe pays PIX deposits now, not the node's own account.** `hopr-types` 4.0.0 routes
#     `SafePayloadGenerator::transfer` through the Safe module, so `withdraw` debits the Safe
#     whoever signs. The pool follows that rather than fighting it. The node account still pays
#     the sweep's *gas* top-up, which is signed on its own behalf. `localcluster` funds and
#     asserts against both accordingly — see `PixSettings::safe_deposit_float`.
#   - `build_non_anonymous` takes the node's `ChainKeypair`: the sweep and the gas top-up are
#     signed by keys the node's Safe-bound connector cannot represent, so the pool builds its own.
#   - `PoolConfig` gained `blokli_url` (where those connectors connect) and
#     `tx_timeout_multiplier` (how long they wait for a confirmation — the node's setting does not
#     reach them, and the default times out against Anvil).
#   - `PixStrategyConfig` gained `max_spend_per_window` / `spend_window`;
#     `NonAnonymousDepositPoolConfig` gained `min_node_xdai_reserve` / `min_safe_hopr_reserve`.
#     All carry serde defaults, so existing `Pix` stanzas still parse unchanged.
#   - Both builders now call `StrategyError::validate_config` before constructing anything, so a
#     bad stanza fails at `build_strategies` instead of at the first deposit.
hopr-strategy = { version = "4.0.0", default-features = false }
# Feature set stated explicitly, carried over from `main`. The default set is `cli` + `redb`;
# `serde` is not in it, and `main` turns it on, so leaving this bare would silently drop a
# feature the rest of the workspace expects.
hopr-ticket-manager = { version = "0.7.0", default-features = false, features = [
  "redb",
  "cli",
  "serde",
] }
# `transport-quic` explicitly: published 0.9.4 predates hoprnet's QUIC-by-default change, so
# the feature is what keeps the transport hoprd builds the same as the one hoprnet ships.
hopr-transport-p2p = { version = "0.11.0", features = ["transport-quic"] }

# Third-party deps
anyhow = "1.0.104"
home = "0.5.12"
async-signal = "0.2.14"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["http2"] }
base64 = "0.23.1"
bimap = "0.6.3"
bytesize = { version = "2.7.0", features = ["serde"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = [
  "std",
  "clock",
] }
clap = { version = "4.6.5", features = ["derive", "env", "string"] }
const_format = "0.2.36"
console-subscriber = "0.5.0"
flagset = "0.4.7"
futures = { version = "0.3.33", default-features = false, features = [
  "std",
  "async-await",
] }
futures-core = "0.3.33"
http = "1.5.0"
human-bandwidth = { version = "0.1.4", features = ["serde"] }
humansize = "2.1.3"
humantime-serde = "1.1.1"
if-addrs = "0.15.0"
lazy_static = "1.5.0"
mockall = "0.15.0"
mimalloc = { version = "0.1.52", default-features = false, features = [
  "secure",
] }
nix = { version = "0.31.3", features = ["fs", "signal"] }
parking_lot = "0.12.5"
rstest = "0.26.1"
oas3 = "0.22.0"
openapiv3 = "2.2.0"
opentelemetry = { version = "0.32.0" }
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry-prometheus-text-exporter = { version = "0.3.0" }
opentelemetry_sdk = { version = "0.32.1" }
percent-encoding = "2.3.2"
prettyplease = "0.3.0"
proc-macro-regex = "~1.1.0"
progenitor = "0.14.0"
progenitor-client = "0.14.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
serde_with = { version = "3.21.0", features = ["base64"] }
signal-hook = "0.4.4"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.3", features = ["full"] }
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.19"
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"] }
tikv-jemallocator = "0.7.0"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "tracing",
] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.0", features = [
  "validate-request",
  "compression-full",
  "cors",
  "trace",
  "sensitive-headers",
] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-opentelemetry = { version = "0.33.0" }
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "fmt",
  "registry",
  "std",
] }
utoipa = { version = "5.5.0" }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = [
  "axum",
  "vendored",
  "debug-embed",
] }
uuid = { version = "1.23.3" }
validator = { version = "0.21.0", features = ["derive"] }
vergen-gix = { version = "10.0.2", features = ["build"] }

[profile.dev]
panic = "abort"
opt-level = 1
strip = false
debug = true

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.candidate]
inherits = "release"
codegen-units = 16
lto = false
panic = "abort"
strip = true
opt-level = 2

[profile.test]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
opt-level = 3

[profile.bench]
debug = 2
split-debuginfo = "off"
strip = false

# memory profiling profile — inherits release optimizations but preserves debug symbols
# for jeprof symbol resolution
[profile.memprof]
inherits = "release"
debug = 2
strip = false
lto = "thin"
codegen-units = 16

[profile.flamegraph]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16

[workspace.metadata.cargo-shear]
ignored = ["hopr-api"]
