# Build with `--cfg tokio_unstable` so the hoprnet crates (hopr-utilities and the
# transport stack) get Tokio's improved cooperative yielding on the async hot
# paths. Cargo does NOT merge `[build]` and target-specific rustflags — the
# matching target table wins outright — so the flag is repeated in the aarch64
# table below as well as `[build]`. `--check-cfg` keeps `-D warnings` clean.
# NOTE: the Nix dev/CI shells set CARGO_BUILD_RUSTFLAGS (linker flag), which
# Cargo lets *replace* this file, so the flag is also appended in flake.nix.
[build]
rustflags = ["--cfg", "tokio_unstable", "--check-cfg", "cfg(tokio_unstable)"]

# Enable hardware AES intrinsics on Apple Silicon — selects aes::armv8 backend
# at compile time instead of aes::soft::fixslice. The aes crate v0.8 requires
# --cfg aes_armv8 (not just target-feature=+aes) to activate the armv8 module.
# Restricted to aarch64-apple-darwin: Apple Silicon always has the AES crypto
# extension; aarch64-unknown-linux-* cannot make that guarantee.
[target.aarch64-apple-darwin]
rustflags = [
  "--cfg=aes_armv8",
  "-Ctarget-feature=+aes,+neon",
  "--cfg",
  "tokio_unstable",
  "--check-cfg",
  "cfg(tokio_unstable)",
]

[env]
# rustc overflows its 8 MiB default stack while monomorphizing `hopr-transport` in the
# dev/test profile. The secp256k1 `HoprPixSpec` represents a PIX group element as
# `hybrid_array::Array<u8, U33>`, whose typenum index is a deeply nested `UInt<UInt<…>>`;
# resolving that inside the transport's already-deep generic stack is what tips it over.
# 16 MiB is the size rustc's own overflow diagnostic suggests. Release builds are
# unaffected, so this only matters for `cargo test` / `cargo build`.
RUST_MIN_STACK = "16777216"
