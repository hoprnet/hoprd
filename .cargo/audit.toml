[advisories]
ignore = [
  "RUSTSEC-2024-0436", # 'paste' dependency in 'libp2p' [unmaintained]
  "RUSTSEC-2024-0388", # 'derivative' in 'alloy' [unmaintained],
  "RUSTSEC-2025-0073", # 'alloy-dyn-abi' in 'alloy' - will be removed in 4.0
  "RUSTSEC-2025-0137", # `alloy` - held back until removed, see https://github.com/hoprnet/hoprnet/issues/7707
  "RUSTSEC-2026-0049", # `rustls-webpki` - needs alloy removal
  "RUSTSEC-2026-0118", # `hickory-proto` 0.25.2 pulled by libp2p-dns 0.44.0 -> libp2p 0.56.0; no fix for 0.25.x; cannot remove without a major libp2p bump
  "RUSTSEC-2026-0119", # same root cause as 0118 (different advisory DB version); hickory-proto 0.25.2 still pulled by libp2p 0.56.0; remove together with 0118 once libp2p is bumped past 0.56.0
  "RUSTSEC-2026-0173", # 'proc-macro-error2' [unmaintained]; pulled via alloy (alloy-sol-macro) and validator_derive 0.20 (validator 0.21.0 still pins validator_derive 0.20); no fix released yet
  "RUSTSEC-2026-0221", # 'event-listener' 5.4.1 [unsound] - transitive via moka; upstream fix pending
  "RUSTSEC-2026-0249", # 'smartstring' 1.0.1 [unmaintained] - transitive via opentelemetry-prometheus-text-exporter; no fix released yet
  "RUSTSEC-2026-0253", # 'lru' 0.16.4 [unsound] - transitive via alloy-provider; remove together with the alloy removal (0137)
  "RUSTSEC-2024-0449", # 'unsafe-libyaml' [unmaintained] - transitive via serde_yaml (deprecated) <- progenitor build-dep of rest-api-client; no fix, cannot remove without progenitor dropping serde_yaml
  "RUSTSEC-2026-0367", # 'zip' 3.0.0 [insecure SUID/SGID] - pinned by utoipa-swagger-ui 9.0.2; zip >=9.0.0 is semver-incompatible
  "RUSTSEC-2026-0368", # 'zip' 3.0.0 [symlink escape] - same root cause as 0367; remove together with 0367 once utoipa-swagger-ui drops zip <9.0.0
  "RUSTSEC-2026-0369", # 'zip' 3.0.0 [permissions through symlinks, critical] - same root cause; all three zip advisories clear together
  "RUSTSEC-2026-0387", # 'crypto-bigint' 0.5.5 timing variability, pulled by elliptic-curve 0.13.8 -> k256 0.13.4 (alloy's signer stack); fix needs elliptic-curve 0.14.x / k256 0.14.x, blocked on the same alloy removal as 0137/0253
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
# No `path` key on purpose. cargo-audit does not expand `~` read from this file: it takes the value
# literally, relative to the working directory, so `path = "~/.cargo/advisory-db"` made `cargo audit`
# clone ~40 MB into a directory actually named `~` in the repo root — untracked, ungitignored, and
# re-cloned per repo. The `--db` default is already `~/.cargo/advisory-db` and *is* expanded
# correctly, so naming it here only broke the thing it was restating.
url = "https://github.com/RustSec/advisory-db.git"
fetch = true
stale = false

[output]
# TODO: restore `deny = ["warnings"]` once `core2` (yanked, transitive via libp2p's multihash) is resolved upstream.
# cargo-audit has no per-package yanked ignore — see https://github.com/rustsec/rustsec/issues/1453
deny = ["unmaintained", "unsound"]
format = "terminal"                # "terminal" (human readable report) or "json"
quiet = false                      # Only print information on error
show_tree = true                   # Show inverse dependency trees along with advisories (default: true)

[target]
arch = [
  "x86_64",
  "aarch64",
] # Ignore advisories for CPU architectures other than these
os = [
  "linux",
  "windows",
  "macos",
] # Ignore advisories for operating systems other than these

[yanked]
enabled = true
update_index = true
