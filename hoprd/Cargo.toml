[package]
name = "hoprd"
version = "5.0.0-rc.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A complete HOPR node daemon and reference implementation of the HOPR protocol"
homepage.workspace = true
repository.workspace = true
license.workspace = true
build = "build.rs"

[features]

default = [
  "runtime-tokio",
  "telemetry",
  "transport-quic",
  "allocator-jemalloc",
  "session-server",
] # uses tokio by default because of axum
runtime-tokio = [
  "dep:tokio",
  "hopr-lib/runtime-tokio",
  "opentelemetry_sdk?/rt-tokio",
  "opentelemetry_sdk?/experimental_trace_batch_span_processor_with_async_runtime",
  "opentelemetry_sdk?/experimental_logs_batch_log_processor_with_async_runtime",
  "opentelemetry_sdk?/experimental_metrics_periodicreader_with_async_runtime",
  "hopr-strategy/runtime-tokio",
  "hopr-strategy/strategy-auto-funding",
  "hopr-strategy/strategy-auto-redeeming",
  "hopr-strategy/strategy-closure-finalizer",
  "hopr-strategy/strategy-channel-lifecycle",
  "hopr-transport-p2p/runtime-tokio",
]
# === PIX deposit pool: pick exactly one ===
#
# Curvy pool: production deposit pool
strategy-pix-curvy = ["pix", "hopr-strategy/strategy-pix-curvy"]

# Plain pool — Ethereum deposit addresses settled with ordinary, fully visible on-chain
# transfers. What the localcluster tests and the PIX demo run against, and currently the only pool
# that is implemented.
strategy-pix-test = [
  "pix",
  "hopr-strategy/strategy-pix-test",
  "hopr-lib/pix-secp256k1",
]

# Picked automatically once one of the above pools is selected.
pix = ["runtime-tokio"]
telemetry = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-prometheus-text-exporter",
  "dep:flagset",
  "dep:tracing-opentelemetry",
  "hopr-lib/telemetry",
  "hoprd-api/telemetry",
  "hopr-strategy/telemetry",
  "hopr-transport-p2p/telemetry",
]
transport-quic = [
  "hopr-transport-p2p/transport-quic",
  "hopr-lib/transport-announce-quic",
]
# Negotiates `/plaintext/2.0.0` instead of `noise` on p2p connections, leaving their traffic
# readable on the wire.
#
# For running a local cluster under a protocol dissector: HOPR's onion encryption sits underneath
# the transport's, so with noise in the way a capture is unreadable even to someone holding every
# node's packet key. See `hopr-transport-p2p`'s `insecure-plaintext`, and the `hopr-wireshark`
# dissector for what it is for.
#
# **Never build a node for a real network with this.** Every packet it sends — tickets,
# acknowledgements, SURBs, session payloads — is readable by anyone on the path. Build it as:
#
#     cargo build -p hoprd --no-default-features \
#       --features runtime-tokio,session-server,strategy-pix-test,insecure-plaintext
#
# `transport-quic` must stay out of that set. Not a build error — it simply takes precedence, and
# the node keeps noise and says so on start, because QUIC's TLS 1.3 is part of the transport and
# could not be read anyway. Leaving it out is therefore what makes the capture readable, and it
# makes the node announce `/ip4/.../tcp/<port>`, which is what the dissector reads.
insecure-plaintext = ["hopr-transport-p2p/insecure-plaintext"]
capture = ["hopr-lib/capture"]
# To use profiling:
# 1. Set RUSTFLAGS="--cfg tokio_unstable" before building
# 2. Enable the 'prof' feature: cargo build --feature prof
prof = [
  "dep:console-subscriber",
] # must be built with 'tokio_unstable': https://github.com/tokio-rs/console/tree/main/console-subscriber

allocator-mimalloc = [
  "dep:mimalloc",
] # Use mimalloc as the global allocator on Linux
allocator-jemalloc = [
  "dep:tikv-jemallocator",
] # Use jemalloc as the global allocator on Linux
allocator-jemalloc-profiling = [
  "allocator-jemalloc",
  "tikv-jemallocator/profiling",
] # Compile jemalloc with --enable-prof for heap profiling
allocator-jemalloc-stats = [
  "allocator-jemalloc",
  "dep:tikv-jemalloc-ctl",
  "dep:humansize",
]
session-server = ["hopr-lib/session-server"]

[dependencies]
anyhow = { workspace = true }
async-signal = { workspace = true }
clap = { workspace = true }
lazy_static = { workspace = true }
console-subscriber = { workspace = true, optional = true }
futures = { workspace = true }
flagset = { workspace = true, optional = true }
home = { workspace = true }
if-addrs = { workspace = true }
humansize = { workspace = true, optional = true, features = ["no_alloc"] }
humantime-serde = { workspace = true }
proc-macro-regex = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
smart-default = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
validator = { workspace = true }
opentelemetry = { workspace = true, optional = true, features = ["metrics"] }
opentelemetry-otlp = { workspace = true, features = [
  "trace",
  "metrics",
  "logs",
  "reqwest-client",
  "tls-roots",
  "http-proto",
  "http-json",
  "grpc-tonic",
], optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = [
  "metrics",
  "experimental_metrics_custom_reader",
] }
opentelemetry-prometheus-text-exporter = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

hopr-strategy = { workspace = true }
hopr-lib = { workspace = true, features = [
  "runtime-tokio",
  "session-client",
  "utils_parallel",
  "telemetry",
] }
hopr-utils-session = { workspace = true }
hoprd-api = { workspace = true, features = ["telemetry"] }
hopr-chain-connector = { workspace = true }
hopr-ct-full-network = { workspace = true }
hopr-network-graph = { workspace = true, features = ["petgraph"] }
hopr-session-server-forwarder = { workspace = true, features = [
  "runtime-tokio",
] }
hopr-ticket-manager = { workspace = true }
hopr-transport-p2p = { workspace = true }

# Target-specific dependencies for memory allocators
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, features = [
  "stats",
  "profiling",
], optional = true }

[build-dependencies]
vergen-gix = { workspace = true, features = ["build"] }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
test-log = { workspace = true }
hopr-lib = { workspace = true, features = [
  "runtime-tokio",
  "session-client",
  "session-server",
  "utils_parallel",
  "testing",
] }

[package.metadata.cargo-machete]
ignored = ["humantime-serde", "lazy_static"]

[package.metadata.cargo-shear]
ignored = ["humantime-serde", "lazy_static"]
