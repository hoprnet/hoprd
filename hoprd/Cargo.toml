[package]
name = "hoprd"
version = "5.0.0-rc.1"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A complete HOPR node daemon and reference implementation of the HOPR protocol"
homepage.workspace = true
repository.workspace = true
license.workspace = true
build = "build.rs"

[features]
# No `strategy-pix-*` pairing here, deliberately. Each one pins `HoprPixSpec` to a different
# deposit-address type, and a spec has exactly one — so the choice is exclusive *at this level*
# even though `hopr-strategy` now compiles both pools together. Cargo unifies features across a
# workspace build, so a default pairing would collide with the one `hoprd-localcluster` selects
# for the pool it tests. An exclusive choice cannot have a default; it has to be named by whoever
# builds.
default = [
  "runtime-tokio",
  "telemetry",
  "transport-quic",
  "allocator-jemalloc",
  "session-server",
] # uses tokio by default because of axum
runtime-tokio = [
  "dep:tokio",
  "hopr-lib/runtime-tokio",
  "opentelemetry_sdk?/rt-tokio",
  "opentelemetry_sdk?/experimental_trace_batch_span_processor_with_async_runtime",
  "opentelemetry_sdk?/experimental_logs_batch_log_processor_with_async_runtime",
  "opentelemetry_sdk?/experimental_metrics_periodicreader_with_async_runtime",
  "hopr-strategy/runtime-tokio",
  "hopr-strategy/strategy-auto-funding",
  "hopr-strategy/strategy-auto-redeeming",
  "hopr-strategy/strategy-closure-finalizer",
  "hopr-strategy/strategy-channel-lifecycle",
  "hopr-transport-p2p/runtime-tokio",
]
# === PIX deposit pool: pick exactly one ===
#
# NOTE: `CurvyDepositPool` is currently a stub whose methods panic. A build with this feature
# starts and serves normally; it panics on the first PIX deposit, which only happens once a
# `Pix` strategy stanza is in the config.
strategy-pix-curvy = ["pix", "hopr-strategy/strategy-pix-curvy"]
# Ethereum deposit addresses — what the localcluster tests and the PIX demo run against, and
# currently the only pool that is implemented.
#
# `hopr-lib/pix-secp256k1` is stated positively rather than left to `default-features = false`,
# because that opt-out only holds while every crate in the graph agrees to it — `hopr-utils-session`
# pulling `hopr-lib` with defaults was enough to undo it, silently.
strategy-pix-secp256k1 = [
  "pix",
  "hopr-strategy/strategy-pix-secp256k1",
  "hopr-lib/pix-secp256k1",
]
# "some PIX pool is selected", so the code that does not care which can gate on one name.
# Pulls `runtime-tokio` because the PIX strategy needs the tokio runtime; enabling a pairing
# without it would compile to a binary that silently has no PIX.
#
# Not meant to be enabled directly — on its own it selects no pool and `hopr_strategy::pix`
# will not resolve.
pix = ["runtime-tokio"]
telemetry = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-prometheus-text-exporter",
  "dep:flagset",
  "dep:tracing-opentelemetry",
  "hopr-lib/telemetry",
  "hoprd-api/telemetry",
  "hopr-strategy/telemetry",
  "hopr-transport-p2p/telemetry",
]
transport-quic = [
  "hopr-transport-p2p/transport-quic",
  "hopr-lib/transport-announce-quic",
]
capture = ["hopr-lib/capture"]
# To use profiling:
# 1. Set RUSTFLAGS="--cfg tokio_unstable" before building
# 2. Enable the 'prof' feature: cargo build --feature prof
prof = [
  "dep:console-subscriber",
] # must be built with 'tokio_unstable': https://github.com/tokio-rs/console/tree/main/console-subscriber

allocator-mimalloc = [
  "dep:mimalloc",
] # Use mimalloc as the global allocator on Linux
allocator-jemalloc = [
  "dep:tikv-jemallocator",
] # Use jemalloc as the global allocator on Linux
allocator-jemalloc-profiling = [
  "allocator-jemalloc",
  "tikv-jemallocator/profiling",
] # Compile jemalloc with --enable-prof for heap profiling
allocator-jemalloc-stats = [
  "allocator-jemalloc",
  "dep:tikv-jemalloc-ctl",
  "dep:humansize",
]
session-server = ["hopr-lib/session-server"]

[dependencies]
anyhow = { workspace = true }
async-signal = { workspace = true }
clap = { workspace = true }
lazy_static = { workspace = true }
console-subscriber = { workspace = true, optional = true }
futures = { workspace = true }
flagset = { workspace = true, optional = true }
home = { workspace = true }
if-addrs = { workspace = true }
humansize = { workspace = true, optional = true, features = ["no_alloc"] }
humantime-serde = { workspace = true }
proc-macro-regex = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
smart-default = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
validator = { workspace = true }
opentelemetry = { workspace = true, optional = true, features = ["metrics"] }
opentelemetry-otlp = { workspace = true, features = [
  "trace",
  "metrics",
  "logs",
  "reqwest-client",
  "tls-roots",
  "http-proto",
  "http-json",
  "grpc-tonic",
], optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = [
  "metrics",
  "experimental_metrics_custom_reader",
] }
opentelemetry-prometheus-text-exporter = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

hopr-strategy = { workspace = true }
hopr-lib = { workspace = true, features = [
  "runtime-tokio",
  "session-client",
  "utils_parallel",
  "telemetry",
] }
hopr-utils-session = { workspace = true }
hoprd-api = { workspace = true, features = ["telemetry"] }
hopr-chain-connector = { workspace = true }
hopr-ct-full-network = { workspace = true }
hopr-network-graph = { workspace = true, features = ["petgraph"] }
hopr-session-server-forwarder = { workspace = true, features = [
  "runtime-tokio",
] }
hopr-ticket-manager = { workspace = true }
hopr-transport-p2p = { workspace = true }

# Target-specific dependencies for memory allocators
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, features = [
  "stats",
  "profiling",
], optional = true }

[build-dependencies]
vergen-gix = { workspace = true, features = ["build"] }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
test-log = { workspace = true }
hopr-lib = { workspace = true, features = [
  "runtime-tokio",
  "session-client",
  "session-server",
  "utils_parallel",
  "testing",
] }

[package.metadata.cargo-machete]
ignored = ["humantime-serde", "lazy_static"]

[package.metadata.cargo-shear]
ignored = ["humantime-serde", "lazy_static"]
