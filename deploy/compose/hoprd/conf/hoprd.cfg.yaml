---
blokli_url: https://blokli.prod.hoprnet.link
# Maximum time to wait for the on-chain graph to sync at startup (default 5m)
connection_sync_timeout: 5m
# Percentage (1-100) of on-chain state to sync before ready (default 100). Below 100 starts faster but risks
# purging unredeemed tickets. Only use a lower value on Entry nodes (and possibly Exit nodes) for faster startup.
# Relay nodes must keep 100.
sync_tolerance: 100
# Attempts to connect to Blokli and sync before the node exits, with a growing delay between them (default 3)
connection_attempts: 3
identity:
  file: "/app/hoprd/conf/hopr.id"
db:
  data: /app/hoprd/data
api:
  enable: true
  host:
    address:
      IPv4: 0.0.0.0
    port: 3001
    # Flow-control (AIMD send-window) profile for sessions this node initiates as a
    # client via the session API: off | clean | robust. Only affects node-originated
    # sessions — relays and exit nodes never run flow control. Default: robust.
    # Only exists in the exit build: the relay-only build has no Session API and rejects it.
    # session_flow_control: robust
strategy:
  allow_recursive: false
  strategies:
    - AutoRedeeming:
        redeem_all_on_close: true
    - ChannelLifecycle:
        population:
          min_open_channels: 5
          target_open_channels: 20
        funding:
          sizing_mode:
            probabilistic:
              success_probability: 0.99
          initial_capacity: "1 GiB"
          topup_capacity: "512 MiB"
          lower_capacity_threshold: "512 MiB"
        finalizer:
          finalize_max_concurrent: 5
        concurrency:
          max_concurrent_actions: 5
hopr:
  network:
    probe_recheck_threshold: "120s"
    # Probes go out probe_pace / probe_dial apart. probe_dial: 0 stops generated probing.
    # probe_pace: "500ms"
    # probe_dial: 1.0
    # Share of outgoing slots kept for probes while session data is queued (0.0..=0.5).
    # probe_share: 0.1
    # CT nodes may retain remote relayers by reducing latency bias and retaining more candidates.
    # path_planner:
    #   latency_halflife: "10s"
    #   max_cached_paths: 128
    #   min_paths_anonymity_floor: 0
    #   return_path_exploration: 0.25
  # outgoing_ticket_winning_prob: 1.0
  # outgoing_ticket_price: "0.03 wxHOPR"
  # min_incoming_ticket_price: "0.06 wxHOPR"
  host:
    address:
      IPv4: 127.0.0.1 # NOTE: adapt this to reflect your public IP
    port: 9091 # NOTE: adapt this to reflect your public PORT - the value set in HOPRD_P2P_PORT
  safe_module:
    safe_address: "0x0000000000000000000000000000000000000000" # NOTE: fill in value
    module_address: "0x0000000000000000000000000000000000000000" # NOTE: fill in value
