---
blokli_url: https://blokli.prod.hoprnet.link
identity:
  file: "/app/hoprd/conf/hopr.id"
db:
  data: /app/hoprd/data
api:
  enable: true
  host:
    address:
      IPv4: 0.0.0.0
    port: 3001
  # Flow-control (AIMD send-window) profile for sessions this node initiates as a
  # client via the session API: off | clean | robust. Only affects node-originated
  # sessions — relays and exit nodes never run flow control. Default: robust.
  session_flow_control: robust
strategy:
  allow_recursive: false
  strategies:
    - AutoRedeeming:
        redeem_all_on_close: true
    # Keeps the Safe's wxHOPR allowance for the Channels contract topped up, so that
    # channel opening and funding do not revert once the allowance is spent.
    - AutoApproval:
        min_allowance_threshold: "100 wxHOPR"
        allowance_amount: "1000 wxHOPR"
    - ChannelLifecycle:
        population:
          min_open_channels: 5
          target_open_channels: 20
        funding:
          sizing_mode:
            probabilistic:
              success_probability: 0.99
          initial_capacity: "1 GiB"
          topup_capacity: "512 MiB"
          lower_capacity_threshold: "512 MiB"
        finalizer:
          finalize_max_concurrent: 5
        concurrency:
          max_concurrent_actions: 5
hopr:
  network:
  # outgoing_ticket_winning_prob: 1.0
  # outgoing_ticket_price: "0.03 wxHOPR"
  # min_incoming_ticket_price: "0.06 wxHOPR"
  host:
    address:
      IPv4: 127.0.0.1 # NOTE: adapt this to reflect your public IP
    port: 9091 # NOTE: adapt this to reflect your public PORT - the value set in HOPRD_P2P_PORT
  safe_module:
    safe_address: "0x0000000000000000000000000000000000000000" # NOTE: fill in value
    module_address: "0x0000000000000000000000000000000000000000" # NOTE: fill in value
