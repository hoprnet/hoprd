---
blokli_url: https://blokli.prod.hoprnet.link
db:
  data: /var/lib/hoprd
identity:
  file: "/etc/hoprd/hopr.id"
  password: "change_me"
api:
  enable: true
strategy:
  allow_recursive: false
  strategies:
    - AutoRedeeming:
        redeem_all_on_close: true
    - ChannelLifecycle:
        population:
          min_open_channels: 5
          target_open_channels: 20
        funding:
          sizing_mode:
            probabilistic:
              success_probability: 0.99
          initial_capacity: "1 GiB"
          topup_capacity: "512 MiB"
          lower_capacity_threshold: "512 MiB"
        finalizer:
          finalize_max_concurrent: 5
        concurrency:
          max_concurrent_actions: 5
hopr:
  network:
    probe_interval: "60s"
    probe_recheck_threshold: "120s"
    # CT nodes may retain remote relayers by reducing latency bias and retaining more candidates.
    # path_planner:
    #   latency_halflife: "10s"
    #   max_cached_paths: 128
    #   min_paths_anonymity_floor: 0
    #   return_path_exploration: 0.25
  # outgoing_ticket_winning_prob: 1.0
  # outgoing_ticket_price: "0.03 wxHOPR"
  # min_incoming_ticket_price: "0.06 wxHOPR"
  safe_module:
    safe_address: "0x0000000000000000000000000000000000000000" # NOTE: fill in value
    module_address: "0x0000000000000000000000000000000000000000" # NOTE: fill in value
